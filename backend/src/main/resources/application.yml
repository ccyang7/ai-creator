spring:
  application:
    name: ai-creator
  # 禁用 LangChain4j 的 OpenAI 自动配置：其 HttpClientBuilder 强依赖 Spring RestClient，
  # 而该实现经 HttpComponents 读取 chunked 响应（无 Content-Length）时只会得到 1 字节，
  # 导致所有 AI 调用解析失败。本项目的模型统一由 org.cy.aicreator.config 下的配置类手工构建
  # （含其原本提供的 openAiChatModel，见 ChatModelConfig），HTTP 客户端由
  # langchain4j-http-client-jdk 提供，不依赖此自动配置。
  autoconfigure:
    exclude: dev.langchain4j.openai.spring.AutoConfig
  session:
    redis:
      flush-mode: immediate
      namespace: "ai-creator:session"
    timeout: 3600

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_creator_db?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}

  profiles:
    active: local

  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      ttl: 3600

logging:
  level:
    dev:
      langchain4j: debug

server:
  port: 8200
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 3600

# AI 监控平台上报（完整参数见 AiMonitorProperties）
# base-url 与 api-key 是凭据：放在 application-local.yml / application-prod.yml（均被 .gitignore 忽略），
# 或由运行环境注入环境变量，不要写进本文件。两者任一为空时整条上报链路静默跳过，模型调用照常进行。
ai-monitor:
  enabled: true
  base-url: ${AI_MONITOR_BASE_URL:}
  api-key: ${AI_MONITOR_API_KEY:}
  # 服务提供方标识，平台按它分组统计
  provider: deepseek
  # 是否上报提问与回答正文。关掉后平台详情抽屉里看不到内容，但正文不会离开本服务
  report-content: true
  # 正文上报前的截断长度。生成链路的系统提示词很长，没必要全量发过去
  input-max-length: 2000
  output-max-length: 4000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: org.cy.aicreator.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

